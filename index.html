<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Reclaim Portal</title>
    <style>
        :root {
            --bg-color: #0b0f0e;
            --card-bg: #121816;
            --accent-green: #00ff66;
            --accent-dim: #00cc52;
            --text-muted: #8c9c95;
            --border-color: #1f2b26;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .mobile-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: 70px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background-color: var(--accent-green);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--bg-color);
            font-weight: bold;
            font-size: 20px;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            cursor: pointer;
        }

        .connect-btn {
            background-color: var(--accent-green);
            color: var(--bg-color);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
        }

        .connect-btn:hover {
            background-color: var(--accent-dim);
        }

        .content {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .stat-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stat-title {
            color: var(--text-muted);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: var(--accent-green);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent-green);
        }

        .explorer-dropdown {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .tx-table-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            overflow-x: auto;
        }

        .tx-header-row {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .tx-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(31, 43, 38, 0.5);
        }

        .tx-row:last-child {
            border-bottom: none;
        }

        .tx-hash {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: monospace;
            font-size: 14px;
        }

        .badge {
            background: rgba(255, 170, 0, 0.15);
            color: #ffaa00;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-green {
            background: rgba(0, 255, 102, 0.15);
            color: var(--accent-green);
        }

        .tx-amount {
            color: var(--accent-green);
            font-weight: 600;
            font-size: 14px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 100;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 20px;
        }

        .nav-item.active {
            color: var(--accent-green);
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <div class="top-bar">
            <div class="logo-area">
                <div class="logo-icon">Y</div>
            </div>
            <div class="top-actions">
                <button class="icon-btn">🌙</button>
                <button class="icon-btn">🌐</button>
                <button id="connectBtn" class="connect-btn">Connect</button>
            </div>
        </div>

        <div class="content">
            <div class="stat-card">
                <div class="stat-title">🛡️ SOL Reclaimed</div>
                <div class="stat-value">377.31 🪙</div>
            </div>

            <div class="stat-card">
                <div class="stat-title">📦 Accounts Processed</div>
                <div class="stat-value">204.3K</div>
            </div>

            <div class="stat-card">
                <div class="stat-title">💼 Active Wallets</div>
                <div class="stat-value">48.7K</div>
            </div>

            <div class="section-header">
                <span class="section-title">Recent Transactions</span>
                <div class="explorer-dropdown">
                    <span>Solscan</span> ▼
                </div>
            </div>

            <div class="tx-table-card">
                <div class="tx-header-row">
                    <span>Transaction</span>
                    <span>Amount Reclaimed</span>
                </div>
                <div class="tx-row">
                    <div class="tx-hash">uvJQh... <span class="badge">🔥 1</span></div>
                    <div class="tx-amount">0.001991 🪙</div>
                </div>
                <div class="tx-row">
                    <div class="tx-hash">4SUwA... <span class="badge badge-green">📦 1</span></div>
                    <div class="tx-amount">0.001991 🪙</div>
                </div>
                <div class="tx-row">
                    <div class="tx-hash">KpPYP... <span class="badge badge-green">📦 1</span></div>
                    <div class="tx-amount">0.001991 🪙</div>
                </div>
                <div class="tx-row">
                    <div class="tx-hash">2jMkG... <span class="badge badge-green">📦 5</span></div>
                    <div class="tx-amount">0.009956 🪙</div>
                </div>
                <div class="tx-row">
                    <div class="tx-hash">63p7d... <span class="badge badge-green">💊 🎁</span></div>
                    <div class="tx-amount">0.011431 🪙</div>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <button class="nav-item active">Y</button>
            <button class="nav-item">?</button>
            <button class="nav-item">🎁</button>
            <button class="nav-item">👤</button>
            <button class="nav-item">🎧</button>
        </div>
    </div>

    <script>
        const connectBtn = document.getElementById('connectBtn');

        async function detectProvider() {
            if ('solana' in window) {
                const provider = window.solana;
                if (provider.isPhantom) {
                    return provider;
                }
            }
            window.open('https://phantom.app/', '_blank');
            throw new Error("Phantom wallet not found.");
        }

        connectBtn.addEventListener('click', async () => {
            try {
                const provider = await detectProvider();
                const response = await provider.connect();
                const publicKey = response.publicKey.toString();
                
                console.log("Connected Wallet:", publicKey);
                connectBtn.innerText = publicKey.slice(0, 4) + '...' + publicKey.slice(-4);
                alert("Wallet connected: " + publicKey);
            } catch (err) {
                console.error("Connection failed:", err);
            }
        });
    </script>
</body>
</html>
